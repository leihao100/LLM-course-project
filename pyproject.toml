[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-chart-safety"
version = "0.1.0"
description = "Research harness for chart corruption and independent action scoring"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
chartguard = "chartguard.__main__:main"

[tool.setuptools]
packages = ["chartguard"]

[tool.setuptools.data-files]
"share/clinical-chart-safety/vendor" = ["vendor/*.py", "vendor/*.json", "vendor/LICENSE.MedAgentBench"]
"share/clinical-chart-safety/configs" = ["configs/*.json"]
